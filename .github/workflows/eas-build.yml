name: EAS Android Test Build (staging)

on:
  push:
    branches:
      - staging

  pull_request:
    branches:
      - staging

jobs:
  android-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm cache clean --force
          npm ci --legacy-peer-deps

      - name: Log in to Expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas login --non-interactive

      - name: Setup EAS
        run: |
          npx eas --version
          npx eas whoami

      - name: Run EAS Android Test Build
        id: eas-build
        run: |
          echo "🔧 Starting EAS build..."
          echo "Current directory: $(pwd)"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "EAS version: $(npx eas --version)"

          npm run build:android:test -- --non-interactive > build-log.txt 2>&1 || {
            echo "❌ EAS build failed. Showing build-log.txt:"
            cat build-log.txt
            echo "❌ npm debug log:"
            find /home/runner/.npm/_logs -name "*debug*.log" -exec cat {} \; || echo "No npm debug logs found"
            exit 1
          }
          BUILD_URL=$(grep -o 'https://expo.dev/accounts[^ ]*' build-log.txt | tail -1)
          echo "✅ EAS build triggered: $BUILD_URL"
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT

      - name: Send notification to Discord
        if: ${{ env.DISCORD_WEBHOOK_STAGING_URL != '' }}
        env:
          DISCORD_WEBHOOK_STAGING_URL: ${{ secrets.DISCORD_WEBHOOK_STAGING_URL }}
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\": \"🚀 Nouveau build Android (staging) disponible : ${{ steps.eas-build.outputs.build_url }}\"}" \
          $DISCORD_WEBHOOK_STAGING_URL

      - name: Comment PR with build link
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const buildUrl = "${{ steps.eas-build.outputs.build_url }}";
            const pr = context.payload.pull_request;
            await github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Un nouveau build Android (profil \`test\`) est disponible pour cette PR :\n🔗 ${buildUrl}`
            });
